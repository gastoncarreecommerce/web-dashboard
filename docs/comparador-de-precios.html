<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de competencia</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>
  /* Página independiente: no entra al nav del dashboard a propósito. */
  .cpx-cmp { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .cpx-cmp h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .cpx-cmp .sub { color: var(--muted, #6b7280); margin: 0 0 1.5rem; font-size: .9rem; }

  .panel { background: var(--card, #fff); border: 1px solid var(--line, #e5e7eb);
           border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .panel h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
              color: var(--muted, #6b7280); margin: 0 0 .75rem; }

  textarea { width: 100%; min-height: 8rem; font-family: ui-monospace, monospace;
             font-size: .85rem; padding: .6rem; border: 1px solid var(--line, #e5e7eb);
             border-radius: 8px; background: var(--bg, #fff); color: inherit; resize: vertical; }
  .fila { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: .75rem; }
  .cpx-btn { background: #2a78d6; color: #fff; border: 0; border-radius: 8px;
         padding: .55rem 1.1rem; font-size: .9rem; font-weight: 600; cursor: pointer; }
  .cpx-btn:disabled { opacity: .5; cursor: default; }
  .cpx-btn.sec { background: transparent; color: inherit; border: 1px solid var(--line, #e5e7eb); }
  .tiendas { display: flex; gap: 1rem; flex-wrap: wrap; }
  .tiendas label { display: flex; align-items: center; gap: .4rem; font-size: .9rem; cursor: pointer; }

  .aviso { border-radius: 8px; padding: .7rem .9rem; font-size: .85rem; margin-bottom: .75rem;
           border: 1px solid; line-height: 1.45; }
  .aviso details { margin-top: .35rem; }
  .aviso summary { cursor: pointer; font-weight: 600; font-size: .8rem; }
  .aviso ul { margin: .4rem 0 0; padding-left: 1.1rem; max-height: 9rem; overflow-y: auto; }
  .aviso li { margin-bottom: .2rem; }
  .aviso.cpx-info { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
  .aviso.cpx-warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .aviso.cpx-bad  { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  .tabla-wrap { overflow-x: auto; margin: 0 -1.25rem -1.25rem; padding: 0 1.25rem 1.25rem; }
  table.cpx-cmp-t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .85rem; }
  table.cpx-cmp-t th, table.cpx-cmp-t td {
    padding: .7rem .75rem; text-align: left; vertical-align: middle;
    border-bottom: 1px solid var(--line, #eef0f3);
  }
  table.cpx-cmp-t thead th {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted, #6b7280); font-weight: 600; white-space: nowrap;
    position: sticky; top: 0; z-index: 2; background: var(--card, #fff);
    border-bottom: 1px solid var(--line, #e5e7eb);
  }
  /* Las dos primeras columnas quedan fijas: con cinco tiendas hay scroll
     horizontal y perder de vista de que producto se trata lo vuelve inutil. */
  table.cpx-cmp-t th:nth-child(1), table.cpx-cmp-t td:nth-child(1) { position: sticky; left: 0; z-index: 1; background: var(--card, #fff); }
  table.cpx-cmp-t th:nth-child(2), table.cpx-cmp-t td:nth-child(2) { position: sticky; left: 7.5rem; z-index: 1; background: var(--card, #fff); min-width: 16rem; }
  table.cpx-cmp-t thead th:nth-child(1), table.cpx-cmp-t thead th:nth-child(2) { z-index: 3; }
  table.cpx-cmp-t tbody tr:hover td { background: var(--hover, #fafbfc); }
  table.cpx-cmp-t td.cpx-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 8.5rem; }

  .ean { font-family: ui-monospace, monospace; font-size: .75rem; color: var(--muted, #9ca3af); }
  .cpx-prod { font-size: .84rem; line-height: 1.35; }
  .precio { font-weight: 650; font-size: .95rem; display: block; }
  .antes { font-size: .74rem; color: var(--muted, #9ca3af); }
  .antes s { text-decoration: line-through; }
  .off { color: #067a55; font-weight: 600; }

  /* El ganador: un fondo apenas verde y un check. El bloque verde oscuro
     tapaba el numero y ensuciaba toda la tabla. */
  td.barato { background: #f0fdf5 !important; box-shadow: inset 2px 0 0 #16a34a; }
  td.barato .precio { color: #067a55; }
  td.barato .precio::after { content: ' ✓'; font-size: .8em; }

  .nada { color: var(--muted, #c7cbd1); font-size: .8rem; font-weight: 400; }
  /* Un solo renglon para cualquier problema, en vez de dos o tres avisos
     apilados que hacian ilegible la celda. */
  .ojo { display: block; font-size: .72rem; color: #b45309; margin-top: .15rem; cursor: help; }
  .promo { display: block; font-size: .71rem; color: #6d28d9; margin-top: .2rem;
           line-height: 1.25; max-width: 12rem; margin-left: auto;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Diferencia contra nuestra tienda: es la pregunta del negocio. Rojo cuando
     el competidor esta mas barato (perdemos), verde cuando esta mas caro. */
  .vs { display: block; font-size: .72rem; font-weight: 600; margin-top: .1rem; }
  .vs.peor { color: #dc2626; }
  .vs.mejor { color: #067a55; }
  .thnota { display: block; font-size: .65rem; font-weight: 500; color: #b45309;
            text-transform: none; letter-spacing: 0; cursor: help; max-width: 9rem;
            margin-left: auto; white-space: normal; line-height: 1.25; }
  .prog { font-size: .85rem; color: var(--muted, #6b7280); }
  /* Sin @media (prefers-color-scheme: dark) a proposito: el resto del
     dashboard no tiene modo oscuro, asi que con el sistema en oscuro esta
     pagina se pintaba mitad clara y mitad oscura —las celdas del ganador
     quedaban en verde oscuro sobre fondo blanco. */
</style>
</head>
<body>
<div class="cpx-cmp">
  <h1>Comparador de competencia</h1>
  <p class="sub">Precios y promociones de una lista de EANs en las tiendas de la competencia, vía la API pública de VTEX de cada sitio.</p>

  <div class="panel">
    <h2>1 · Los EANs</h2>
    <textarea id="eans" placeholder="Un EAN por línea, o separados por coma.&#10;7790742358608&#10;7791720029411&#10;7798033333907"></textarea>
    <div class="fila">
      <input type="file" id="archivo" accept=".txt,.csv,.tsv">
      <span class="prog" id="cuenta"></span>
    </div>
    <div class="fila">
      <label style="font-size:.85rem">Código postal
        <input id="cp" type="text" inputmode="numeric" maxlength="4" value="1425"
          style="width:5rem; margin-left:.4rem; padding:.35rem .5rem; border:1px solid var(--line,#e5e7eb); border-radius:6px; background:var(--bg,#fff); color:inherit">
      </label>
      <span class="prog">Los precios de supermercado varían por zona, y las tiendas de Cencosud
        no cotizan sin ubicación.</span>
    </div>
  </div>

  <div class="panel">
    <h2>2 · Las tiendas</h2>
    <div class="tiendas" id="tiendas"></div>
    <div class="fila">
      <button class="cpx-btn" id="buscar">Comparar precios</button>
      <button class="cpx-btn sec" id="csv" disabled>Bajar CSV</button>
      <span class="prog" id="prog"></span>
    </div>
  </div>

  <div id="avisos"></div>
  <div class="panel" id="panel-res" hidden>
    <h2 id="titulo-res">3 · Resultados</h2>
    <div class="tabla-wrap"><table class="cpx-cmp-t" id="tabla"></table></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Tope del endpoint. Ahora cada producto lleva una simulacion de carrito
  // aparte del catalogo, asi que las tandas son chicas: con 5 tiendas, 20 EANs
  // son ~100 simulaciones por request, que es lo que entra en el tiempo de una
  // funcion serverless.
  const POR_TANDA = 20;

  const TIENDAS = [
    { id: 'carrefour', nombre: 'Carrefour', propia: true },
    { id: 'jumbo', nombre: 'Jumbo' },
    { id: 'disco', nombre: 'Disco' },
    { id: 'masonline', nombre: 'Masonline' },
    { id: 'dia', nombre: 'DIA' },
  ];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plata = (n) => n == null ? '—' : '$' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let ultimo = null;

  // ── Entrada ────────────────────────────────────────────────────────────────
  function leerEans() {
    const crudos = $('eans').value.split(/[\s,;]+/).map((s) => s.trim()).filter(Boolean);
    const validos = [...new Set(crudos.filter((e) => /^\d{8,14}$/.test(e)))];
    const malos = crudos.filter((e) => !/^\d{8,14}$/.test(e));
    return { validos, malos, crudos };
  }

  function contar() {
    const { validos, malos } = leerEans();
    const partes = [];
    if (validos.length) partes.push(`${validos.length} EAN${validos.length === 1 ? '' : 's'} válido${validos.length === 1 ? '' : 's'}`);
    if (malos.length) partes.push(`${malos.length} sin formato de EAN (se ignoran)`);
    $('cuenta').textContent = partes.join(' · ');
  }

  $('eans').addEventListener('input', contar);
  $('archivo').addEventListener('change', (ev) => {
    const f = ev.target.files?.[0];
    if (!f) return;
    const lector = new FileReader();
    lector.onload = () => {
      // De un CSV se toma la primera columna de cada línea: es donde suele
      // estar el código. El resto se descarta y el contador avisa cuántos no
      // tenían forma de EAN.
      const texto = String(lector.result || '');
      const eans = texto.split(/\r?\n/).map((l) => l.split(/[,;\t]/)[0].trim()).filter(Boolean);
      $('eans').value = eans.join('\n');
      contar();
    };
    lector.readAsText(f);
  });

  $('tiendas').innerHTML = TIENDAS.map((t) => `<label>
    <input type="checkbox" value="${t.id}" checked> ${esc(t.nombre)}${t.propia ? ' (nuestra)' : ''}
  </label>`).join('');

  const tiendasElegidas = () => [...$('tiendas').querySelectorAll('input:checked')].map((i) => i.value);

  // ── Consulta ───────────────────────────────────────────────────────────────
  function avisar(html) { $('avisos').innerHTML = html; }

  async function buscar() {
    const { validos, malos } = leerEans();
    const tiendas = tiendasElegidas();

    if (!validos.length) return avisar('<div class="aviso cpx-bad">No hay ningún EAN válido. Tienen que ser de 8 a 14 dígitos.</div>');
    if (!tiendas.length) return avisar('<div class="aviso cpx-bad">Elegí al menos una tienda.</div>');

    $('buscar').disabled = true;
    $('csv').disabled = true;
    const tandas = [];
    for (let i = 0; i < validos.length; i += POR_TANDA) tandas.push(validos.slice(i, i + POR_TANDA));

    const juntos = { resultados: {}, errores: {}, simulacionErrores: {}, canalErrores: {},
      comboPorTienda: {}, codigoPostal: null, tiendas: null,
      advertencia: null, fuente: null, eans: [], simuladas: 0, aSimular: 0 };
    let fallo = null;

    for (let i = 0; i < tandas.length; i += 1) {
      $('prog').textContent = `Consultando tanda ${i + 1} de ${tandas.length}…`;
      try {
        const cp = ($('cp').value || '').trim();
        const r = await fetch(`/api/competencia?eans=${tandas[i].join(',')}`
          + `&tiendas=${tiendas.join(',')}${/^\d{4}$/.test(cp) ? `&cp=${cp}` : ''}`,
          { cache: 'no-store' });
        const j = await r.json().catch(() => null);
        if (!r.ok) { fallo = j?.message || j?.error || `HTTP ${r.status}`; break; }
        Object.assign(juntos.resultados, j.resultados);
        juntos.eans.push(...j.eans);
        juntos.tiendas = j.tiendas;
        juntos.advertencia = j.advertencia;
        // Sin esta linea el aviso de `fuente` nunca se muestra: el merge de las
        // tandas copiaba solo `advertencia`.
        juntos.fuente = j.fuente;
        for (const [id, errs] of Object.entries(j.errores || {})) {
          (juntos.errores[id] = juntos.errores[id] || []).push(...errs);
        }
        // Los contadores se SUMAN entre tandas, no se sobreescriben.
        for (const [id, motivos] of Object.entries(j.simulacionErrores || {})) {
          const acc = (juntos.simulacionErrores[id] = juntos.simulacionErrores[id] || {});
          for (const [m, n] of Object.entries(motivos)) acc[m] = (acc[m] || 0) + n;
        }
        juntos.simuladas += j.simuladas || 0;
        juntos.aSimular += j.aSimular || 0;
        Object.assign(juntos.comboPorTienda, j.comboPorTienda || {});
        Object.assign(juntos.canalErrores, j.canalErrores || {});
        juntos.codigoPostal = j.codigoPostal;
      } catch (e) { fallo = e.message; break; }
    }

    $('prog').textContent = '';
    $('buscar').disabled = false;

    if (fallo) return avisar(`<div class="aviso cpx-bad"><strong>No se pudo consultar.</strong> ${esc(fallo)}</div>`);

    ultimo = juntos;
    pintar(juntos, malos);
    $('csv').disabled = false;
  }

  $('buscar').addEventListener('click', buscar);

  // ── Salida ─────────────────────────────────────────────────────────────────
  function pintar(d, malos) {
    const tiendas = d.tiendas || [];
    const eans = d.eans;

    const avisos = [];
    if (d.advertencia) avisos.push(`<div class="aviso cpx-info">${esc(d.advertencia)}</div>`);
    if (malos?.length) {
      avisos.push(`<div class="aviso cpx-warn">${malos.length} línea(s) no tenían forma de EAN y se ignoraron:
        <span class="ean">${esc(malos.slice(0, 8).join(', '))}${malos.length > 8 ? '…' : ''}</span></div>`);
    }
    if (d.fuente) avisos.push(`<div class="aviso cpx-info">${esc(d.fuente)}</div>`);

    // Fallos de simulacion AGRUPADOS por tienda y motivo. Si falla en todas las
    // celdas de una tienda, lo util es el motivo una vez —no una lista de 76
    // celdas truncada a 6, que es lo que habia antes y no dejaba ver la causa.
    const grupos = Object.entries(d.simulacionErrores || {});
    if (grupos.length) {
      const detalle = grupos.map(([id, motivos]) => {
        const t = tiendas.find((x) => x.id === id);
        const total = Object.values(motivos).reduce((a, b) => a + b, 0);
        const porQue = Object.entries(motivos)
          .sort((a, b) => b[1] - a[1]).slice(0, 3)
          .map(([m, n]) => `${esc(m)} (${n}×)`).join('; ');
        return `<li><strong>${esc(t?.nombre || id)}</strong>: ${total} sin simular — ${porQue}</li>`;
      }).join('');
      avisos.push(`<div class="aviso cpx-bad">
        <strong>La simulación de carrito falló en algunas tiendas.</strong>
        Para esos productos se muestra el precio del catálogo, que puede no incluir
        promociones. Están marcados y no compiten por el "más barato".
        <details><summary>ver detalle</summary>
        <ul>${detalle}</ul></details></div>`);
    }
    if (d.aSimular) {
      const combos = Object.entries(d.comboPorTienda || {})
        .map(([id, c]) => {
          const t = tiendas.find((x) => x.id === id);
          return `${esc(t?.nombre || id)}: ${c ? esc(c) : '<strong>ninguna combinación funcionó</strong>'}`;
        }).join(' · ');
      avisos.push(`<div class="aviso cpx-info">${d.simuladas} de ${d.aSimular} precios salieron de la
        simulación de carrito (con promociones aplicadas), con CP ${esc(String(d.codigoPostal || ''))}.
        ${combos ? `<br><span class="ean">${combos}</span>` : ''}</div>`);
    }

    // Cuando NINGUNA combinacion funciono para una tienda, se listan todos los
    // intentos con su error. Es lo unico que permite ver si fallan todos por lo
    // mismo (entonces no es el canal ni la zona) o si el motivo cambia.
    for (const [id, intentos] of Object.entries(d.canalErrores || {})) {
      const t = tiendas.find((x) => x.id === id);
      const lista = (Array.isArray(intentos) ? intentos : [String(intentos)])
        .map((x) => `<li><span class="ean">${esc(x)}</span></li>`).join('');
      avisos.push(`<div class="aviso cpx-bad">
        <strong>${esc(t?.nombre || id)}: ninguna combinación de canal y zona pudo cotizar.</strong>
        <details open><summary>los ${Array.isArray(intentos) ? intentos.length : 1} intentos</summary>
        <ul>${lista}</ul></details></div>`);
    }
    for (const [id, errs] of Object.entries(d.errores || {})) {
      const t = tiendas.find((x) => x.id === id);
      avisos.push(`<div class="aviso cpx-bad"><strong>${esc(t?.nombre || id)} no respondió a ${errs.length} consulta(s).</strong>
        Las columnas de esa tienda están incompletas, no vacías por falta de producto.
        <br><span class="ean">${esc(errs.slice(0, 3).join(' · '))}</span></div>`);
    }
    avisar(avisos.join(''));

    // Cabecera
    // El motivo del fallo va en la CABECERA de la columna cuando afecta a la
    // mayoria de las celdas de esa tienda. Antes estaba solo en un cartel
    // arriba de la tabla y en los tooltips: con 76 celdas fallando, quien mira
    // la tabla no lo encontraba nunca. Si el problema es de la tienda entera,
    // se dice en el titulo de la tienda.
    const th = ['<th>EAN</th>', '<th>Producto</th>'].concat(tiendas.map((t) => {
      const motivos = d.simulacionErrores?.[t.id];
      let nota = '';
      if (motivos) {
        const fallos = Object.values(motivos).reduce((a, b) => a + b, 0);
        const conProducto = eans.filter((e) => d.resultados[e]?.[t.id]?.encontrado).length;
        if (conProducto && fallos >= conProducto * 0.5) {
          const peor = Object.entries(motivos).sort((a, b) => b[1] - a[1])[0][0];
          nota = `<br><span class="thnota" title="${esc(peor)}">sin simular: ${esc(peor.slice(0, 40))}${peor.length > 40 ? '…' : ''}</span>`;
        }
      }
      return `<th class="cpx-num"${t.propia ? ' style="color:#2a78d6"' : ''}>${esc(t.nombre)}${nota}</th>`;
    }));

    const filas = eans.map((ean) => {
      const porTienda = d.resultados[ean] || {};
      // El más barato entre los que tienen precio Y stock: comparar contra un
      // producto sin stock no sirve para decidir nada.
      // Un precio sin simular puede no incluir promociones, asi que NO compite
      // por el "mas barato": declararlo ganador o perdedor seria una conclusion
      // sacada de un numero que no es el que ve el cliente.
      const precios = tiendas
        .map((t) => ({ id: t.id, ...(porTienda[t.id] || {}) }))
        .filter((x) => x.encontrado && x.precio != null && x.disponible && !x.simulacionFallo)
        .map((x) => x.precio);
      const min = precios.length ? Math.min(...precios) : null;

      // .find() devuelve el OBJETO, no el nombre: sin el .nombre del final la
      // celda mostraba "[object Object]".
      const nombre = tiendas.map((t) => porTienda[t.id]).find((x) => x?.nombre)?.nombre;

      // Nuestro precio, para el delta. Si no lo tenemos, no se muestra ninguno:
      // un "vs" sin referencia no significa nada.
      const propia = tiendas.find((t) => t.propia);
      const nuestro = propia ? porTienda[propia.id] : null;
      const base = (nuestro?.encontrado && nuestro.precio != null && !nuestro.simulacionFallo)
        ? nuestro.precio : null;

      const celdas = tiendas.map((t) => {
        const x = porTienda[t.id];
        if (!x || !x.encontrado) return '<td class="cpx-num"><span class="nada">—</span></td>';

        const malo = Boolean(x.simulacionFallo) || Boolean(x.listaSospechosa);
        const barato = min != null && x.precio === min && x.disponible && !malo;

        const bits = [`<span class="precio">${plata(x.precio)}</span>`];

        // Antes / descuento, en un solo renglon.
        if (x.precioLista != null && x.descuentoPct) {
          bits.push(`<span class="antes"><s>${plata(x.precioLista)}</s> <span class="off">−${x.descuentoPct}%</span></span>`);
        }

        // Diferencia contra nuestra tienda.
        if (base != null && !t.propia && x.precio != null && x.disponible && !malo) {
          const d = Math.round((x.precio / base - 1) * 1000) / 10;
          if (d !== 0) {
            bits.push(`<span class="vs ${d < 0 ? 'peor' : 'mejor'}" title="${d < 0
              ? 'Más barato que nosotros' : 'Más caro que nosotros'}">${d > 0 ? '+' : ''}${d}% vs Carrefour</span>`);
          }
        }

        if (!x.disponible) bits.push('<span class="ojo" title="La tienda lo tiene publicado pero sin stock.">sin stock</span>');

        // UN solo renglon para el problema, con el detalle en el tooltip. Antes
        // se apilaban "sin promos aplicadas" y "precio de lista dudoso" y la
        // celda se volvia ilegible.
        if (malo) {
          const por = x.simulacionFallo
            ? `No se pudo simular el carrito (${x.simulacionFallo}), así que este es el precio del catálogo y puede no incluir promociones.`
            : `La tienda devolvió ${plata(x.listaSospechosa.valor)} como precio anterior, que implicaría −${x.listaSospechosa.pctImplicado}%. No es creíble, así que no se muestra.`;
          bits.push(`<span class="ojo" title="${esc(por)}">precio sin verificar</span>`);
        }

        // UNA promo visible y el resto en un contador. Carrefour declara varias
        // por producto ("Tarjeta Carrefour 15%", "Cuenta Digital 15% Off...") y
        // apilarlas hacia filas de cuatro renglones de alto.
        const ps = x.promos || [];
        if (ps.length) {
          const resto = ps.length > 1 ? ` +${ps.length - 1}` : '';
          bits.push(`<span class="promo" title="${esc(ps.join(' · '))}">${esc(ps[0])}${resto}</span>`);
        }
        return `<td class="cpx-num${barato ? ' barato' : ''}">${bits.join('')}</td>`;
      });

      return `<tr>
        <td class="ean">${esc(ean)}</td>
        <td class="cpx-prod">${nombre ? esc(nombre) : '<span class="nada">sin datos</span>'}</td>
        ${celdas.join('')}
      </tr>`;
    });

    $('tabla').innerHTML = `<thead><tr>${th.join('')}</tr></thead><tbody>${filas.join('')}</tbody>`;

    // Cuántos encontró cada tienda: sin esto, una columna vacía puede leerse
    // como "no lo vende" cuando en realidad la consulta no encontró el EAN.
    const cobertura = tiendas.map((t) => {
      const n = eans.filter((e) => d.resultados[e]?.[t.id]?.encontrado).length;
      return `${t.nombre} ${n}/${eans.length}`;
    }).join(' · ');
    $('titulo-res').textContent = `3 · Resultados — ${cobertura}`;
    $('panel-res').hidden = false;
  }

  // ── CSV ────────────────────────────────────────────────────────────────────
  $('csv').addEventListener('click', () => {
    if (!ultimo) return;
    const tiendas = ultimo.tiendas || [];
    const cab = ['ean', 'producto'];
    for (const t of tiendas) cab.push(`${t.id}_precio`, `${t.id}_lista`, `${t.id}_desc_pct`,
      `${t.id}_stock`, `${t.id}_promos`, `${t.id}_precio_catalogo`, `${t.id}_sin_simular`);
    const q = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;

    const lineas = [cab.join(',')];
    for (const ean of ultimo.eans) {
      const porTienda = ultimo.resultados[ean] || {};
      const nombre = tiendas.map((t) => porTienda[t.id]).find((x) => x?.nombre)?.nombre || '';
      const fila = [q(ean), q(nombre)];
      for (const t of tiendas) {
        const x = porTienda[t.id] || {};
        fila.push(q(x.precio ?? ''), q(x.precioLista ?? ''), q(x.descuentoPct ?? ''),
          q(x.encontrado ? (x.disponible ? 'si' : 'no') : ''), q((x.promos || []).join(' | ')),
          q(x.precioCatalogo ?? ''), q(x.simulacionFallo ? 'si' : ''));
      }
      lineas.push(fila.join(','));
    }
    const blob = new Blob(['﻿' + lineas.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `comparador-competencia-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  contar();
})();
</script>
</body>
</html>
