<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebDash — Carrefour Argentina</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">W</span>WebDash</div>
      <div class="nav-section">Principal</div>
      <nav class="nav">
        <a class="nav-item active" href="#">Dashboard</a>
      </nav>
      <div class="sidebar-foot">Canal Web · Carrefour AR</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1>Dashboard</h1>
          <span id="range-label" class="range-label">—</span>
        </div>
        <div class="topbar-controls">
          <div class="preset-group" id="preset-group" role="tablist">
            <button class="preset" data-preset="yesterday">Ayer</button>
            <button class="preset" data-preset="7d">7d</button>
            <button class="preset" data-preset="30d">30d</button>
            <button class="preset" data-preset="month">Mes</button>
            <button class="preset" data-preset="all">Todo</button>
          </div>
          <div class="custom-range">
            <input type="date" id="date-from" />
            <span>–</span>
            <input type="date" id="date-to" />
          </div>
        </div>
      </header>

      <div class="subbar">
        <label class="compare-toggle">
          <input type="checkbox" id="compare-toggle" checked />
          Comparar vs. período anterior
        </label>
        <span id="compare-label" class="compare-label"></span>
      </div>

      <!-- Las 4 pestañas tienen que coincidir con config/segment-map.json > tabs.
           Duplicado a mano porque este HTML es estático. -->
      <nav class="tabs" role="tablist">
        <button class="tab active" data-bucket="food" role="tab" aria-selected="true">🥦 Food</button>
        <button class="tab" data-bucket="non-food" role="tab" aria-selected="false">🏠 Non Food</button>
        <button class="tab" data-bucket="marketplace" role="tab" aria-selected="false">🛒 Marketplace</button>
        <button class="tab" data-bucket="quickcommerce" role="tab" aria-selected="false">⚡ Quick Commerce</button>
      </nav>

      <main id="content" class="content">
        <div class="loading">Cargando métricas...</div>
      </main>

      <footer class="footer">
        Datos generados automáticamente por el pipeline de GitHub Actions. Ver <code>data/web/daily-summary.json</code>.
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
