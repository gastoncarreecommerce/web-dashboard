<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebDash — Carrefour Argentina</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">W</span><span>WebDash<em>canal web</em></span></div>

      <div class="nav-section">Principal</div>
      <nav class="nav">
        <a class="nav-item active" href="#" data-view="dashboard"><span class="ni">📊</span>Dashboard</a>
        <a class="nav-item" href="#" data-view="analytics"><span class="ni">🔬</span>Analítica</a>
        <a class="nav-item" href="#" data-view="audiences"><span class="ni">🎯</span>Audiencias</a>
      </nav>

      <div class="sidebar-foot">
        <div class="sf-title">Carrefour Argentina</div>
        <div class="sf-sub">Pedidos del canal web · VTEX</div>
        <button class="logout" id="logout">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="tb-left">
          <h1 id="view-title">Dashboard</h1>
          <span id="range-label" class="range-label">—</span>
        </div>
        <div class="tb-right" id="date-controls">
          <div class="preset-group">
            <button class="preset" data-preset="yesterday">Ayer</button>
            <button class="preset" data-preset="7d">7d</button>
            <button class="preset" data-preset="30d">30d</button>
            <button class="preset" data-preset="90d">90d</button>
            <button class="preset active" data-preset="month">Mes</button>
            <button class="preset" data-preset="all">Todo</button>
          </div>
          <div class="custom-range">
            <input type="date" id="date-from" aria-label="Desde" />
            <span>–</span>
            <input type="date" id="date-to" aria-label="Hasta" />
          </div>
        </div>
      </header>

      <div class="subbar">
        <div class="segment-bar" id="segment-bar">
          <button class="seg-pill active" data-bucket="all">🌐 Todos</button>
          <button class="seg-pill" data-bucket="food">🥦 Food</button>
          <button class="seg-pill" data-bucket="non-food">🏠 Non Food</button>
          <button class="seg-pill" data-bucket="marketplace">🛒 Marketplace</button>
          <button class="seg-pill" data-bucket="quickcommerce">⚡ Quick Commerce</button>
        </div>
        <label class="compare-wrap" id="compare-wrap">
          <input type="checkbox" id="compare-toggle" checked />
          <span>Comparar</span>
          <em id="compare-label"></em>
        </label>
      </div>

      <main id="content" class="content">
        <div class="loading">Cargando…</div>
      </main>

      <footer class="footer">
        <div id="meta-bar" class="meta-bar"></div>
        <p>Generado por el pipeline de GitHub Actions desde la VTEX Order API. Los datos publicados son agregados y anonimizados.</p>
      </footer>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="charts.js"></script>
  <script src="view-dashboard.js"></script>
  <script src="view-analytics.js"></script>
  <script src="view-audiences.js"></script>
  <script src="app.js"></script>
</body>
</html>
