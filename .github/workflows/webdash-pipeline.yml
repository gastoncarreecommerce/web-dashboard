# Re-pusheado en commit separado (no en el commit inicial del repo) para que
# GitHub registre el workflow: el push que crea un repo vacío no siempre
# dispara el escaneo de Actions sobre los archivos de ese mismo commit.
name: WebDash data pipeline

on:
  schedule:
    # Misma cadencia que AppDash (fetch-daily.yml en gastoncarreecommerce/vtex-utm-audit):
    # 1 vez por día a las 06:00 UTC = 03:00 AR.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run WEB channel pipeline
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
          PIPELINE_CHANNEL: web
        run: npm run pipeline

      - name: Commit updated data
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "chore(data): update web channel metrics [skip ci]"
          git push
