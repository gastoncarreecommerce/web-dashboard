# Comentario técnico agregado en un commit posterior para que GitHub registre
# el workflow: el push que crea un repo vacío no siempre dispara el escaneo de
# Actions sobre los archivos de ese mismo commit.
name: WebDash data pipeline

on:
  schedule:
    # Misma cadencia que AppDash (fetch-daily.yml en gastoncarreecommerce/vtex-utm-audit):
    # 1 vez por día a las 06:00 UTC = 03:00 AR, procesando el día anterior ya cerrado.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha a procesar (YYYY-MM-DD). Vacío = ayer (AR)'
        required: false
        default: ''
      reconcile_days:
        description: 'Días hacia atrás a reprocesar por pagos que confirman tarde (efectivo, Rapipago, etc.)'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Las tres raíces del pipeline. Desde que los datos pesados salieron del
    # deploy, el insumo crudo y el archivo de pedidos viven en la rama
    # `data-raw` (checkout de abajo) y solo los agregados chicos (~40 MB) van
    # a la rama que deploya Vercel.
    env:
      WEBDASH_DAILY_DIR: ${{ github.workspace }}/.data-raw/data/daily
      WEBDASH_ARCHIVE_ROOT: ${{ github.workspace }}/.data-raw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/carrefour-webdash-analytics-xojjfs

      # El histórico pesado: volcados crudos (1,6 GB) + orders/ y
      # order-index/ (1,1 GB). Vercel no deploya esta rama, así que su peso no
      # entra en ningún deploy.
      - name: Checkout del archivo (rama data-raw)
        uses: actions/checkout@v4
        with:
          ref: data-raw
          path: .data-raw
          sparse-checkout: |
            data/daily
            docs/data/web/orders
            docs/data/web/order-index
            docs/data/app/order-index
            docs/data/web/products-daily
            docs/data/app/products-daily

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch yesterday's orders (or given date)
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=America/Argentina/Buenos_Aires date -d yesterday +%Y-%m-%d)
          fi
          node src/fetch-day.js "$DATE"

      # Un día se procesa una sola vez, en un momento fijo (03:00 AR). Un
      # pedido que a esa hora todavía está en payment-pending (efectivo,
      # Rapipago, Pago Fácil, reintento de tarjeta) queda afuera de las
      # métricas de ese día, y como el archivo ya está escrito nunca se
      # revisa de nuevo — aunque el pago se confirme unas horas después. Por
      # eso los últimos días reales de la serie siempre parecían tener menos
      # pedidos de los que en verdad hay.
      #
      # La solución es reabrir la ventana de días recientes en cada corrida:
      # fetch-day.js relee el estado ACTUAL de VTEX para esa fecha y pisa el
      # archivo entero (--force), así que un pedido que confirmó pago después
      # de la primera pasada entra en la próxima. Días más viejos que la
      # ventana no se tocan: para esta cuenta los pagos ya están resueltos
      # bastante antes de los 5 días de default.
      - name: Reconciliar los últimos días (pagos que confirman tarde)
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
        run: |
          N="${{ github.event.inputs.reconcile_days || '5' }}"
          for i in $(seq 1 "$N"); do
            D=$(TZ=America/Argentina/Buenos_Aires date -d "$i days ago" +%Y-%m-%d)
            echo "Reconciliando $D..."
            node src/fetch-day.js "$D" --force
          done

      # Reintenta los pedidos que hayan fallado en cualquier día ya procesado,
      # no solo en el de hoy: así ningún hueco queda pendiente para siempre.
      - name: Reintentar pedidos caídos
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
        run: node src/repair.js

      - name: Aggregate all available days into per-segment metrics
        run: node src/aggregate.js

      # Canal APP: el pipeline de AppDash (fetch-daily.yml en vtex-utm-audit)
      # corre a la misma hora y ya deja el día anterior cerrado y completo en
      # sus dos repos. Sin este paso, docs/data/app/ queda pisado con lo último
      # que alguien corrió a mano — pasó de verdad: un día quedó con el conteo
      # parcial de las 6am (34 pedidos de App) mostrado como definitivo más de
      # 24 horas después de que AppDash ya tenía el dato completo (541).
      # continue-on-error: si App falla (p. ej. falta el secret), el run queda
      # marcado con el error pero los pasos que PUBLICAN Web siguen corriendo.
      # Sin esto, un problema de App dejaba al dashboard entero sin datos del
      # día (pasó el 24/9: Web se calculó bien y nunca se commiteó).
      - name: Traer datos frescos del canal App
        if: always()
        continue-on-error: true
        env:
          # PAT fine-grained con "Contents: Read" sobre vtex-utm-audit Y
          # appdash-private-data. PRIVATE_DATA_TOKEN no sirve: apunta al repo
          # privado de los mails, que es otro.
          APP_DATA_TOKEN: ${{ secrets.APP_DATA_TOKEN }}
        run: |
          if [ -z "$APP_DATA_TOKEN" ]; then
            echo "::error::Falta el secret APP_DATA_TOKEN: los datos de App no se actualizan hasta configurarlo."
            exit 1
          fi
          rm -rf /tmp/vtex-utm-audit /tmp/appdash-private-data
          git clone --depth 1 "https://x-access-token:${APP_DATA_TOKEN}@github.com/gastoncarreecommerce/vtex-utm-audit.git" /tmp/vtex-utm-audit
          git clone --depth 1 "https://x-access-token:${APP_DATA_TOKEN}@github.com/gastoncarreecommerce/appdash-private-data.git" /tmp/appdash-private-data
          node scripts/build-app-summary.mjs --appdash /tmp/vtex-utm-audit --private /tmp/appdash-private-data \
            --archive-root "$GITHUB_WORKSPACE/.data-raw"
          rm -rf /tmp/vtex-utm-audit /tmp/appdash-private-data

      # Los mails salen de la misma pasada que ya pidió el detalle de cada
      # pedido: no cuesta ninguna llamada extra a VTEX. Van SOLO al repo privado.
      - name: Publicar mails al repo privado
        if: always()
        env:
          PRIVATE_DATA_REPO: ${{ secrets.PRIVATE_DATA_REPO }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          if [ -z "$PRIVATE_DATA_REPO" ] || [ -z "$PRIVATE_DATA_TOKEN" ]; then
            echo "::warning::Sin PRIVATE_DATA_REPO/PRIVATE_DATA_TOKEN: no se publican los mails."
            exit 0
          fi
          VIS=$(curl -sS -H "Authorization: Bearer $PRIVATE_DATA_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PRIVATE_DATA_REPO" | python3 -c "import sys,json; print(json.load(sys.stdin).get('private'))")
          if [ "$VIS" != "True" ]; then
            echo "::error::$PRIVATE_DATA_REPO no es privado (private=$VIS). No se publican mails."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:$PRIVATE_DATA_TOKEN@github.com/$PRIVATE_DATA_REPO.git" /tmp/privrepo
          # La base completa pesa ~500MB (5,1M de clientes) y vive repartida en
          # base/ — no publicable como un solo archivo. merge-emails.js la lee,
          # le suma los mails que salieron de este proceso, y shard-emails.js
          # vuelve a repartir el resultado.
          node src/merge-emails.js /tmp/privrepo/base
          node src/shard-emails.js
          for f in private-out/base/*.csv; do
            sz=$(du -m "$f" | cut -f1)
            if [ "$sz" -gt 90 ]; then echo "::error::$f pesa ${sz}MB, muy cerca del límite de GitHub. Subí BASE_SHARDS en src/shard-emails.js."; exit 1; fi
          done
          rm -rf /tmp/privrepo/base /tmp/privrepo/audiencias
          cp -r private-out/base /tmp/privrepo/base
          cp -r private-out/audiencias /tmp/privrepo/audiencias
          rm -f /tmp/privrepo/hash-email.csv
          cd /tmp/privrepo
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add -A base audiencias
          git rm --cached hash-email.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin mails nuevos."
          else
            git commit -m "emails: actualización automática del pipeline"
            ok=0
            for i in 1 2 3 4; do
              git push && { ok=1; break; }
              echo "push falló, reintento $i..."; sleep $((i*5)); git pull --rebase --autostash || true
            done
            [ "$ok" = "1" ] || { echo "::error::No se pudo publicar los mails en $PRIVATE_DATA_REPO tras varios intentos."; exit 1; }
          fi

      # Los agregados que el dashboard necesita al abrir la página. Es lo
      # único que viaja en el deploy, y es el único commit del día en esta
      # rama: Vercel deploya una vez, no diez.
      - name: Commitear agregados (rama deployada)
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add docs/data/ ':!docs/data/web/orders' ':!docs/data/web/order-index'
          if git diff --staged --quiet; then
            echo "Agregados sin cambios."
          else
            git commit -m "chore(data): agregados del dashboard [skip ci]"
            for i in 1 2 3; do git push && break; sleep $((i*5)); git pull --rebase --autostash || true; done
          fi

      # El histórico pesado, que no se deploya: volcados crudos y el detalle
      # de pedidos por tienda/mes que sirve /api/archive a demanda.
      - name: Commitear archivo (rama data-raw)
        working-directory: .data-raw
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add -f data/daily/ docs/data/web/orders/ docs/data/web/order-index/
          if [ -d docs/data/web/products-daily ]; then git add -f docs/data/web/products-daily/; fi
          # Solo si el paso de App lo generó: si falló (continue-on-error), la
          # carpeta puede no existir y un pathspec inexistente hace fallar el
          # add, arrastrando el commit de los volcados de Web.
          if [ -d docs/data/app/order-index ]; then git add -f docs/data/app/order-index/; fi
          if [ -d docs/data/app/products-daily ]; then git add -f docs/data/app/products-daily/; fi
          if git diff --staged --quiet; then
            echo "Archivo sin cambios."
          else
            git commit -m "chore(data): volcados crudos + detalle de pedidos [skip ci]"
            for i in 1 2 3; do git push && break; sleep $((i*5)); git pull --rebase --autostash || true; done
          fi

      # Corre DESPUES de publicar (un día realmente flojo igual se tiene que
      # ver), pero si el último día cerrado quedó implausiblemente bajo en
      # algún canal, el run queda en rojo en Actions en vez de pasar
      # desapercibido hasta que alguien lo note mirando el dashboard.
      - name: Chequear que el dato de ayer no haya quedado incompleto
        run: node scripts/check-data-freshness.mjs
