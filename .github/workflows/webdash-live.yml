# Persiste el día de HOY cada 30 minutos en la rama de archivo `data-raw`.
#
# Ojo con qué hace y qué NO hace: esto ya NO es lo que el dashboard muestra en
# vivo. Los números de hoy en pantalla salen de /api/today-live (VTEX + Redis,
# refresco cada 15s). Este workflow solo guarda el volcado crudo del día para
# que quede en el histórico cuando el día cierre.
#
# Por qué dejó de commitear en la rama que deploya Vercel: cada corrida
# reescribía daily-summary.json (20 MB) y audience-index.json (18 MB) enteros,
# porque son agregados de TODO el histórico y los números de hoy los cambian.
# A 10 corridas por día eso eran ~380 MB de objetos nuevos por día en la rama
# deployada — y como Vercel clona con --depth=10, esos 10 commits se
# transferían en CADA deploy. Era la causa de los deploys de 12 minutos.
# Ahora el agregado corre una sola vez por día (webdash-pipeline.yml) y esta
# corrida de 30 min solo toca `data-raw`, que Vercel no deploya: no dispara
# ningún deploy ni le suma peso a los que sí ocurren.
#
# Es el mismo fetch-day.js del pipeline diario, con --incremental: solo le
# pide detalle a VTEX a los pedidos que todavía no estaban contados de una
# pasada anterior de HOY (el listado completo sí se revisa siempre, es
# barato). Con --incremental el costo de cada corrida es proporcional a lo
# NUEVO desde la pasada anterior, no al total del día.
#
# A propósito NO reintenta pedidos caídos (src/repair.js) ni toca mails: eso
# lo hace el pipeline diario.
name: WebDash hoy en vivo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webdash-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Solo el código, sin datos: este workflow no escribe nada en la rama
      # deployada, así que no hace falta traerse sus agregados.
      - uses: actions/checkout@v4
        with:
          ref: claude/carrefour-webdash-analytics-xojjfs
          sparse-checkout: |
            src
            config
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      # Los volcados crudos del día viven acá. Solo se necesita el directorio
      # de diarios: orders/ y order-index/ los reescribe el pipeline, no esto.
      - name: Checkout del archivo (rama data-raw)
        uses: actions/checkout@v4
        with:
          ref: data-raw
          path: .data-raw
          sparse-checkout: data/daily

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer el día de hoy (AR)
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
          WEBDASH_DAILY_DIR: ${{ github.workspace }}/.data-raw/data/daily
        run: |
          TODAY=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)
          echo "Hoy (AR): $TODAY"
          node src/fetch-day.js "$TODAY" --incremental

      - name: Commitear el volcado crudo en data-raw
        working-directory: .data-raw
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add -f data/daily/
          if git diff --staged --quiet; then
            echo "Sin cambios (nadie compró en los últimos 30 min, o ya estaba al día)."
          else
            git commit -m "chore(data): volcado crudo de hoy [skip ci]"
            for i in 1 2 3; do git push && break; sleep $((i*5)); git pull --rebase --autostash || true; done
          fi
