# Refresca el día de HOY cada 30 minutos, para que el dashboard muestre un
# número "en vivo" en vez de tener que esperar al pipeline de las 03:00 AR
# del día siguiente.
#
# Es el mismo fetch-day.js del pipeline diario, con --incremental: solo le
# pide detalle a VTEX a los pedidos que todavía no estaban contados de una
# pasada anterior de HOY (el listado completo sí se revisa siempre, es
# barato). Antes era --force en cada corrida, releyendo el día entero desde
# cero cada 30 min — hacia la noche, con miles de pedidos ya sumados, eso
# volvía a pedir el detalle de TODOS de nuevo, cada vez más lento a medida
# que avanzaba el día. Con --incremental el costo de cada corrida es
# proporcional a lo NUEVO desde la pasada anterior, no al total del día.
#
# A propósito NO reintenta pedidos caídos (src/repair.js) ni toca mails: eso
# lo hace el pipeline diario. Esto es solo "qué pinta hoy hasta ahora".
name: WebDash hoy en vivo

# Todos los checkouts de este workflow fijan ref: claude/carrefour-webdash-
# analytics-xojjfs a propósito. Es workflow_dispatch: quien lo corre elige una
# rama en el desplegable de GitHub, y el checkout+commit+push sigue esa
# elección por defecto. Como la rama que sirve Vercel es específicamente esa,
# elegir "main" en el desplegable (el hábito natural) escribía los datos en
# una rama que la producción nunca lee — pasó de verdad: un backfill entero
# de 237 días quedó invisible en producción durante horas hasta notarlo.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webdash-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/carrefour-webdash-analytics-xojjfs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer el día de hoy (AR)
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
        run: |
          TODAY=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)
          echo "Hoy (AR): $TODAY"
          node src/fetch-day.js "$TODAY" --incremental

      - name: Agregar
        run: node src/aggregate.js

      - name: Commitear
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add docs/data/ data/daily/
          if git diff --staged --quiet; then
            echo "Sin cambios (nadie compró en los últimos 30 min, o ya estaba al día)."
          else
            git commit -m "chore(data): actualización en vivo de hoy [skip ci]"
            for i in 1 2 3; do git push && break; sleep $((i*5)); git pull --rebase --autostash || true; done
          fi
