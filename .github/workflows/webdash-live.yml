# Persiste el día de HOY cada 30 minutos en la rama de archivo `data-raw`.
#
# Ojo con qué hace y qué NO hace: esto ya NO es lo que el dashboard muestra en
# vivo. Los números de hoy en pantalla salen de /api/today-live (VTEX + Redis,
# refresco cada 15s). Este workflow solo guarda el volcado crudo del día para
# que quede en el histórico cuando el día cierre.
#
# Por qué dejó de commitear en la rama que deploya Vercel: cada corrida
# reescribía daily-summary.json (20 MB) y audience-index.json (18 MB) enteros,
# porque son agregados de TODO el histórico y los números de hoy los cambian.
# A 10 corridas por día eso eran ~380 MB de objetos nuevos por día en la rama
# deployada — y como Vercel clona con --depth=10, esos 10 commits se
# transferían en CADA deploy. Era la causa de los deploys de 12 minutos.
# Ahora el agregado corre una sola vez por día (webdash-pipeline.yml) y esta
# corrida de 30 min solo toca `data-raw`, que Vercel no deploya: no dispara
# ningún deploy ni le suma peso a los que sí ocurren.
#
# Es el mismo fetch-day.js del pipeline diario, con --incremental: solo le
# pide detalle a VTEX a los pedidos que todavía no estaban contados de una
# pasada anterior de HOY (el listado completo sí se revisa siempre, es
# barato). Con --incremental el costo de cada corrida es proporcional a lo
# NUEVO desde la pasada anterior, no al total del día.
#
# A propósito NO reintenta pedidos caídos (src/repair.js) ni toca mails: eso
# lo hace el pipeline diario.
name: WebDash hoy en vivo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: webdash-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout completo de la rama deployada. Son ~42 MB desde que el
      # histórico pesado salió de acá, así que no vale la pena esparcirlo.
      - uses: actions/checkout@v4
        with:
          ref: claude/carrefour-webdash-analytics-xojjfs

      # Los volcados crudos del día viven acá. Solo se necesita el directorio
      # de diarios: orders/ y order-index/ los reescribe el pipeline, no esto.
      - name: Checkout del archivo (rama data-raw)
        uses: actions/checkout@v4
        with:
          ref: data-raw
          path: .data-raw
          sparse-checkout: |
            data/daily
            docs/data/web/products-daily
            docs/data/app/order-index
            docs/data/app/products-daily

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Traer el día de hoy (AR)
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
          WEBDASH_DAILY_DIR: ${{ github.workspace }}/.data-raw/data/daily
        run: |
          TODAY=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)
          echo "Hoy (AR): $TODAY"
          node src/fetch-day.js "$TODAY" --incremental

      # Canal APP: sus días cerrados vienen de AppDash (vtex-utm-audit), no de
      # VTEX directo. Antes solo los traía el pipeline diario, que GitHub larga
      # recién ~9:30 AR: hasta esa hora "Ayer" de App mostraba el conteo
      # parcial de la mañana anterior (pasó el 2/10: 60 pedidos el 1/10). Acá
      # se trae cada 30 min, así App se completa apenas AppDash cierra el día.
      # Es el mismo script del pipeline; continue-on-error para que un
      # problema de App nunca frene lo de Web.
      - name: Traer datos frescos del canal App
        continue-on-error: true
        env:
          APP_DATA_TOKEN: ${{ secrets.APP_DATA_TOKEN }}
        run: |
          if [ -z "$APP_DATA_TOKEN" ]; then echo "::warning::Sin APP_DATA_TOKEN: App no se refresca acá."; exit 0; fi
          rm -rf /tmp/vtex-utm-audit /tmp/appdash-private-data
          git clone -q --depth 1 "https://x-access-token:${APP_DATA_TOKEN}@github.com/gastoncarreecommerce/vtex-utm-audit.git" /tmp/vtex-utm-audit
          git clone -q --depth 1 "https://x-access-token:${APP_DATA_TOKEN}@github.com/gastoncarreecommerce/appdash-private-data.git" /tmp/appdash-private-data
          node scripts/build-app-summary.mjs --appdash /tmp/vtex-utm-audit --private /tmp/appdash-private-data \
            --archive-root "$GITHUB_WORKSPACE/.data-raw"
          rm -rf /tmp/vtex-utm-audit /tmp/appdash-private-data

      # Recalcula los agregados para obtener recent.json (~120 KB) con los
      # últimos dos días. No se commitea daily-summary (20 MB) ni
      # audience-index (18 MB): esos los actualiza el pipeline diario. Esto es
      # lo que mantiene "Hoy" al día sin depender de que /api/today-live tenga
      # Redis configurado.
      # WEBDASH_DAILY_DIR es obligatorio: sin él aggregate.js leía
      # data/daily/ de la rama deployada (donde había quedado un solo archivo
      # suelto, 2026-09-15.json) y recent.json salía con ese único día — "Hoy"
      # y "Ayer" quedaban vacíos y el 15/9 se pisaba con un parcial.
      - name: Agregar
        env:
          WEBDASH_DAILY_DIR: ${{ github.workspace }}/.data-raw/data/daily
          WEBDASH_ARCHIVE_ROOT: ${{ github.workspace }}/.data-raw
        run: node src/aggregate.js

      # Dos archivos chicos, nada más. run-info.json además es lo que sondea
      # el botón "Actualizar" del dashboard para saber que ya llegó el dato.
      - name: Commitear recent.json (rama deployada)
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add docs/data/web/recent.json docs/data/web/_meta/run-info.json
          # App: el resumen diario (~0,7 MB) y el ranking mensual. customers.json
          # (3 MB) lo sigue publicando el pipeline diario.
          git add docs/data/app/daily-summary.json docs/data/app/products.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en recent.json ni en App."
          else
            git commit -m "chore(data): hoy al dia [skip ci]"
            for i in 1 2 3; do git push && break; sleep $((i*5)); git pull --rebase -X theirs --autostash || true; done
          fi

      - name: Commitear el volcado crudo en data-raw
        working-directory: .data-raw
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          git add -f data/daily/
          # El ranking de productos del día (lo que ve la vista Productos con "Hoy").
          if [ -d docs/data/web/products-daily ]; then git add -f docs/data/web/products-daily/; fi
          if [ -d docs/data/app/order-index ]; then git add -f docs/data/app/order-index/; fi
          if [ -d docs/data/app/products-daily ]; then git add -f docs/data/app/products-daily/; fi
          if git diff --staged --quiet; then
            echo "Sin cambios (nadie compró en los últimos 30 min, o ya estaba al día)."
          else
            git commit -m "chore(data): volcado crudo de hoy [skip ci]"
            for i in 1 2 3; do git push && break; sleep $((i*5)); git pull --rebase -X theirs --autostash || true; done
          fi
