name: WebDash inspect search (GA4)

on:
  workflow_dispatch: {}
  # Corrida diaria automática: GA4 usa "yesterday" como último día de datos,
  # así que correr una vez al día alcanza — más seguido no trae nada nuevo.
  schedule:
    - cron: '0 9 * * *' # 06:00 ART

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      # Este workflow no toca el historial de pedidos (docs/data/web/orders/),
      # que es ~1GB y es lo que hace tardar TANTO el checkout normal (varios
      # minutos solo bajando y escribiendo archivos que ni se usan acá).
      # Con sparse-checkout se trae todo MENOS esa carpeta — probado a mano
      # que deja intacto src/, config/ y el resto de docs/data/web/.
      - name: Checkout (sin el historial de pedidos, no hace falta acá)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/docs/data/web/orders/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Inspect GA4 (eventos de búsqueda del sitio web)
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run inspect:search

      - name: Diagnosticar top de búsquedas contra los buscadores reales
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
          # Motor primario primero. Intelligent Search es el que corre en el
          # sitio; el legacy queda al lado solo para comparar (antes el
          # diagnóstico medía SOLO el legacy, o sea un motor que nadie usa).
          # Para sumar Dynamic Yield: "vtex-is,vtex-legacy,dy".
          SEARCH_ENGINES: ${{ vars.SEARCH_ENGINES || 'vtex-is,vtex-legacy' }}
          # Experience Search de DY. Sin estas dos, ese motor se omite con un
          # mensaje que dice qué falta — no rompe la corrida.
          DY_API_KEY: ${{ secrets.DY_API_KEY }}
          # Relevancia semántica con IA. Sin la key, el diagnóstico corre igual
          # con sus reglas y lo dice.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run inspect:search-diagnosis

      - name: Commit report
        run: |
          git config user.name "webdash-bot"
          git config user.email "webdash-bot@users.noreply.github.com"
          [ -f config/search-inspect.report.json ] && git add -f config/search-inspect.report.json
          [ -f config/search-ai-batch.json ] && git add -f config/search-ai-batch.json
          [ -f config/search-diagnosis.report.json ] && git add -f config/search-diagnosis.report.json
          [ -f docs/data/web/search-diagnosis.json ] && git add -f docs/data/web/search-diagnosis.json
          [ -f docs/data/web/search-diagnosis-history.json ] && git add -f docs/data/web/search-diagnosis-history.json
          git diff --cached --quiet || git commit -m "chore(inspect): reporte de búsqueda GA4 + diagnóstico VTEX [skip ci]"
          git push
