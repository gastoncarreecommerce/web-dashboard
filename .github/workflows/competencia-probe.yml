# Averigua de DONDE saca cada tienda el precio que muestra en su ficha.
#
# Para Carrefour, Masonline y DIA el comparador ya lo resuelve con la simulacion
# de carrito. Para Jumbo y Disco (Cencosud) la simulacion rechaza el item en
# todas las combinaciones de canal y codigo postal, con el mismo mensaje, y el
# catalogo devuelve 3.050 cuando la ficha muestra 1.982,50.
#
# Esta corrida prueba las TRES hipotesis que quedan de una sola vez:
#   H1 · el catalogo con otra politica comercial (sc=1/2/3)
#   H2 · Intelligent Search, que es la API que renderiza la ficha
#   H3 · la simulacion variando el seller
#
# Se corre a mano. No toca ningun dato ni commitea nada: imprime y termina.
name: Competencia probe (de donde sale el precio de la ficha)

on:
  workflow_dispatch:
    inputs:
      eans:
        description: 'EANs separados por espacio (vacío = tres de la corrida que falló)'
        required: false
        default: ''
      cp:
        description: 'Código postal para la simulación'
        required: false
        default: '1425'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probar las tres hipotesis de precio
        env:
          COMPETENCIA_CP: ${{ inputs.cp }}
        run: node src/competencia-probe.js ${{ inputs.eans }}
