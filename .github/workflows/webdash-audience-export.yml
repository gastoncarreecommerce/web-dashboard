# PRIVADO — genera el mapeo hash -> email para poder convertir una audiencia
# armada en el dashboard en una lista de mails real.
#
# La salida NO se commitea ni se publica: se sube como artifact de GitHub
# Actions, que solo puede descargar quien tiene acceso al repo. Se baja, se
# arrastra al tab "Audiencias" del dashboard (el cruce pasa en el navegador,
# el archivo no se sube a ningún lado) y de ahí sale el CSV para mailing.
name: WebDash export audiencia (PRIVADO · contiene PII)

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Fecha inicio (YYYY-MM-DD)'
        required: true
      to:
        description: 'Fecha fin (YYYY-MM-DD)'
        required: true
      retention_days:
        description: 'Días que vive el artifact antes de borrarse solo'
        required: false
        default: '7'

permissions:
  contents: read

concurrency:
  group: webdash-audience-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar mapeo hash -> email
        env:
          VTEX_ACCOUNT_NAME: ${{ secrets.VTEX_ACCOUNT_NAME }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ENVIRONMENT: ${{ secrets.VTEX_ENVIRONMENT }}
        run: node src/export-audience.js "${{ github.event.inputs.from }}" "${{ github.event.inputs.to }}"

      - name: Subir como artifact privado
        uses: actions/upload-artifact@v4
        with:
          name: hash-email-${{ github.event.inputs.from }}_${{ github.event.inputs.to }}
          path: private-out/*.csv
          retention-days: ${{ github.event.inputs.retention_days }}
          if-no-files-found: error
